<!--<p>table works!</p>-->
<div class="grid">
  <div class="col-12">
    <div class="card">
      <!--<h5>If login by jwt then data will show</h5>-->
      

      <p-table [value]="dataList" scrollDirection="both" [scrollable]="true" scrollHeight="750px" styleClass="mt-3" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th style="width:200px" pFrozenColumn>Serial No</th>
            <th style="width:200px">User No</th>
            <th style="width:200px">HR Employee Id</th>
            <th style="width:200px">Full Name</th>
            <th style="width:200px">IsActive</th>
            <th style="width:200px">Action</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-dataList let-i="rowIndex">
          <tr>
            <td style="width:200px" pFrozenColumn class="font-bold">{{i + 1}}</td>
            <td style="width:200px">
              <!--<img src="assets/demo/images/flag/flag_placeholder.png" [class]="'flag flag-' + customer.country.code" width="30">-->
              <span class="image-text ml-2">{{dataList.userNo}}</span>
            </td>
            <td style="width:200px">{{dataList.hrEmpId}}</td>
            <td style="width:200px">{{dataList.userFullName}}</td>
            <td style="width:200px">
              {{ dataList.isActive === 1 ? 'Yes' : 'No' }}
            </td>
            <td style="width:200px">
              <div class="flex">
                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"></button>
                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"></button>
              </div>
            </td>
            
            
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
